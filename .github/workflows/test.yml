name: CI - Test Application Inscription

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Récupérer ton code
      - name: Checkout repository
        uses: actions/checkout@v3

      # 2️⃣ Installer Docker Compose
      - name: Set up Docker Compose
        run: |
          sudo apt-get update
          sudo apt-get install -y docker-compose

      # 3️⃣ Lancer les services
      - name: Build and start services
        run: docker-compose up -d --build

      # 4️⃣ Attendre que le backend soit prêt
      - name: Wait for backend
        run: |
          for i in {1..10}; do
            curl -s http://localhost:8081/health && exit 0
            echo "Backend not ready yet..."
            sleep 5
          done
          exit 1

      # 5️⃣ Tester une inscription
      - name: Test inscription API
        run: |
          RESPONSE=$(curl -s -X POST -d "nom=TestUser&email=test@example.com" http://localhost:8081/api.php)
          echo "Response: $RESPONSE"
          if [[ "$RESPONSE" != *"✅"* ]]; then
            echo "Test failed ❌"
            exit 1
          fi
          echo "Test passed ✅"

      # 6️⃣ Nettoyer
      - name: Stop services
        if: always()
        run: docker-compose down
