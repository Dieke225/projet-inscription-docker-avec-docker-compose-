name: CI - Test Application Inscription

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Compose
        run: |
          sudo apt-get update
          sudo apt-get install -y docker-compose

      - name: Build and start services
        run: docker-compose up -d --build

      - name: Wait for backend
        run: |
          for i in {1..20}; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8081/health.php)
            if [ "$STATUS" -eq 200 ]; then
              echo "Backend is ready ✅"
              exit 0
            fi
            echo "Backend not ready yet..."
            sleep 5
          done
          echo "Backend did not start ❌" > test-results.txt
          exit 1

      - name: Test inscription API
        run: |
          RESPONSE=$(curl -s -X POST -d "nom=CIUser&email=ciuser@example.com" http://localhost:8081/api.php || echo "No response")
          echo "Inscription response: $RESPONSE" >> test-results.txt
          if echo "$RESPONSE" | grep -q "Inscription"; then
            echo "Test inscription passed ✅" >> test-results.txt
          else
            echo "Test inscription failed ❌" >> test-results.txt
            exit 1
          fi

      - name: Test list.php
        run: |
          LIST=$(curl -s http://localhost:8081/list.php || echo "No response")
          echo "List response: $LIST" >> test-results.txt
          if echo "$LIST" | grep -q "ciuser@example.com"; then
            echo "User found ✅" >> test-results.txt
          else
            echo "User not found ❌" >> test-results.txt
            exit 1
          fi

      - name: Show test results
        run: cat test-results.txt

      - name: Upload test results
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results.txt

      - name: Save all container logs
        if: always()
        run: docker-compose logs --no-color > all-containers-logs.txt

      - name: Upload all container logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: all-containers-logs
          path: all-containers-logs.txt

      - name: Stop services
        if: always()
        run: docker-compose down
