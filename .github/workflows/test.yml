name: CI - Test Application Inscription

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  backend-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Compose
        run: |
          sudo apt-get update
          sudo apt-get install -y docker-compose

      - name: Build and start services
        run: docker-compose up -d --build

      - name: Wait for backend
        run: |
          for i in {1..20}; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8081/health.php)
            if [ "$STATUS" -eq 200 ]; then
              echo "Backend is ready ✅"
              exit 0
            fi
            echo "Backend not ready yet..."
            sleep 5
          done
          echo "Backend did not start ❌" > test-results.txt
          exit 1

      - name: Reset database users table
        run: |
          docker exec inscription-db mysql -uroot -proot inscriptions -e "DROP TABLE IF EXISTS users; CREATE TABLE users (id INT AUTO_INCREMENT PRIMARY KEY, nom VARCHAR(255), email VARCHAR(255), created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP);"
          echo "Users table reset ✅" >> test-results.txt

      - name: Test inscription API (success)
        run: |
          RESPONSE=$(curl -s -X POST -d "nom=CIUser&email=ciuser@example.com" http://localhost:8081/api.php || echo "No response")
          echo "Inscription response: $RESPONSE" >> test-results.txt
          if echo "$RESPONSE" | grep -qi "inscription"; then
            echo "Test inscription passed ✅" >> test-results.txt
          else
            echo "Test inscription failed ❌" >> test-results.txt
            exit 1
          fi

      - name: Test inscription API (missing fields)
        run: |
          RESPONSE=$(curl -s -X POST -d "nom=&email=" http://localhost:8081/api.php)
          echo "Missing fields response: $RESPONSE" >> test-results.txt
          if echo "$RESPONSE" | grep -qi "remplir"; then
            echo "Missing fields test passed ✅" >> test-results.txt
          else
            echo "Missing fields test failed ❌" >> test-results.txt
            exit 1
          fi

      - name: Test inscription API (duplicate email)
        run: |
          RESPONSE=$(curl -s -X POST -d "nom=CIUser&email=ciuser@example.com" http://localhost:8081/api.php)
          echo "Duplicate response: $RESPONSE" >> test-results.txt
          if echo "$RESPONSE" | grep -qi '"success":false'; then
            echo "Duplicate email test passed ✅" >> test-results.txt
          else
            echo "Duplicate email test failed ❌" >> test-results.txt
            exit 1
          fi

      - name: Show test results
        run: cat test-results.txt

      - name: Upload test results
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results.txt

      - name: Save all container logs
        if: always()
        run: docker-compose logs --no-color > all-containers-logs.txt

      - name: Upload all container logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: all-containers-logs
          path: all-containers-logs.txt

      - name: Stop services
        if: always()
        run: docker-compose down

  frontend-tests:
    runs-on: ubuntu-latest
    needs: backend-tests

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install Cypress
        run: npm install cypress --save-dev

      - name: Run Cypress tests
        run: npx cypress run
