name: CI - Test Application Inscription

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  integration-and-e2e-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install jq and curl
        run: |
          sudo apt-get update
          sudo apt-get install -y jq curl

      # ---------------------------------------------------------
      # OPTIMISATION 1 : Configuration du moteur de cache Docker Buildx
      # ---------------------------------------------------------
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ---------------------------------------------------------
      # OPTIMISATION 2 : Caching des dépendances Node et du binaire Cypress
      # ---------------------------------------------------------
      - name: Cache Cypress binary and Node modules
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/Cypress
            node_modules
          key: ${{ runner.os }}-cypress-${{ hashFiles('**/package.json') }}
          restore-keys: |
            ${{ runner.os }}-cypress-

      # Construction et démarrage avec Buildx pour activer le cache Docker
      - name: Build and start services
        run: |
          docker compose build --build-arg BUILDKIT_INLINE_CACHE=1
          docker compose up -d
        env:
          MYSQL_ROOT_PASSWORD: ${{ secrets.DB_ROOT_PASSWORD }}
          DB_NAME: ${{ secrets.DB_NAME }}

      - name: Wait for services to be healthy
        run: |
          echo "Waiting for services to initialize via Nginx..."
          sleep 15
          if curl -s http://localhost/api.php > /dev/null; then
            echo "All services are up and responding via Nginx ✅"
          else
            echo "Warning: Services might still be starting, continuing anyway..."
          fi

      - name: Reset database users table
        run: |
          docker exec inscription-db mysql -uroot -p"${{ secrets.DB_ROOT_PASSWORD }}" "${{ secrets.DB_NAME }}" -e "DROP TABLE IF EXISTS users; CREATE TABLE users (id INT AUTO_INCREMENT PRIMARY KEY, nom VARCHAR(255), email VARCHAR(255) NOT NULL UNIQUE, created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP);"
          echo "Users table reset ✅" > test-results.txt

      # ==========================================
      # SECTION 1 : TESTS API BACKEND (VIA NGINX)
      # ==========================================
      - name: Test inscription API (success)
        run: |
          RESPONSE=$(curl -s -X POST -d "nom=CIUser&email=ciuser@example.com" http://localhost/api.php || echo "No response")
          echo "Inscription response: $RESPONSE" >> test-results.txt
          SUCCESS_STATUS=$(echo "$RESPONSE" | jq -r '.success' 2>/dev/null || echo "invalid_json")
          if [ "$SUCCESS_STATUS" = "true" ]; then
            echo "Test inscription passed ✅" >> test-results.txt
          else
            echo "Test inscription failed ❌. Server returned: $RESPONSE" >> test-results.txt
            exit 1
          fi

      - name: Test inscription API (missing fields)
        run: |
          RESPONSE=$(curl -s -X POST -d "nom=&email=" http://localhost/api.php)
          echo "Missing fields response: $RESPONSE" >> test-results.txt
          SUCCESS_STATUS=$(echo "$RESPONSE" | jq -r '.success' 2>/dev/null || echo "invalid_json")
          if [ "$SUCCESS_STATUS" = "false" ]; then
            echo "Missing fields test passed ✅" >> test-results.txt
          else
            echo "Missing fields test failed ❌. Server returned: $RESPONSE" >> test-results.txt
            exit 1
          fi

      - name: Test inscription API (duplicate email)
        run: |
          RESPONSE=$(curl -s -X POST -d "nom=CIUser&email=ciuser@example.com" http://localhost/api.php)
          echo "Duplicate response: $RESPONSE" >> test-results.txt
          SUCCESS_STATUS=$(echo "$RESPONSE" | jq -r '.success' 2>/dev/null || echo "invalid_json")
          if [ "$SUCCESS_STATUS" = "false" ]; then
            echo "Duplicate email test passed ✅" >> test-results.txt
          else
            echo "Duplicate email test failed ❌. Server returned: $RESPONSE" >> test-results.txt
            exit 1
          fi

      # ==========================================
      # SECTION 2 : TESTS CYPRESS E2E (VIA NGINX)
      # ==========================================
      - name: Reset table before E2E tests
        run: |
          docker exec inscription-db mysql -uroot -p"${{ secrets.DB_ROOT_PASSWORD }}" "${{ secrets.DB_NAME }}" -e "TRUNCATE TABLE users;"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install and Execute Cypress
        run: |
          # npm init -y crée un package.json s'il n'existe pas pour stabiliser le cache
          [ -f package.json ] || npm init -y
          
          # Installation classique
          npm install cypress
          
          echo "const { defineConfig } = require('cypress'); module.exports = defineConfig({ e2e: { supportFile: false, specPattern: './*.cy.{js,ts}' } });" > cypress.config.js
          
          npx cypress run --browser chrome --config video=false
        env:
          CYPRESS_BASE_URL: http://localhost

      # ==========================================
      # SECTION 3 : NETTOYAGE ET EXPORT DES LOGS
      # ==========================================
      - name: Show test results
        run: cat test-results.txt

      - name: Upload test results
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results.txt

      - name: Save all container logs
        if: always()
        run: docker compose logs --no-color > all-containers-logs.txt

      - name: Upload all container logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: all-containers-logs
          path: all-containers-logs.txt

      - name: Stop services
        if: always()
        run: docker compose down
