name: CI - Test Application Inscription

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Récupérer ton code
      - name: Checkout repository
        uses: actions/checkout@v3

      # 2️⃣ Installer Docker Compose
      - name: Set up Docker Compose
        run: |
          sudo apt-get update
          sudo apt-get install -y docker-compose

      # 3️⃣ Lancer les services
      - name: Build and start services
        run: docker-compose up -d --build

      # 4️⃣ Attendre que le backend soit prêt (jusqu’à 100s)
      - name: Wait for backend
        run: |
          for i in {1..20}; do
            curl -s http://localhost:8081/health && exit 0
            echo "Backend not ready yet..."
            sleep 5
          done
          exit 1

      # 5️⃣ Tester une inscription
      - name: Test inscription API
        run: |
          RESPONSE=$(curl -s -X POST -d "nom=CIUser&email=ciuser@example.com" http://localhost:8081/api.php)
          echo "Response: $RESPONSE" > test-results.txt
          if [[ "$RESPONSE" != *"Inscription réussie"* ]]; then
            echo "Test failed ❌" >> test-results.txt
            exit 1
          fi
          echo "Test passed ✅" >> test-results.txt

      # 6️⃣ Vérifier que l’utilisateur est listé
      - name: Test list.php
        run: |
          LIST=$(curl -s http://localhost:8081/list.php)
          echo "List: $LIST" >> test-results.txt
          if [[ "$LIST" != *"ciuser@example.com"* ]]; then
            echo "User not found in list ❌" >> test-results.txt
            exit 1
          fi
          echo "User found in list ✅" >> test-results.txt

      # 7️⃣ Upload des résultats comme artifact
      - name: Upload test results
        uses: actions/upload-artifact@v3
        with:
          name: test-results
          path: test-results.txt

      # 8️⃣ Capturer les logs du backend pour diagnostic
      - name: Save backend logs
        if: always()
        run: docker logs $(docker ps -q --filter "name=backend") > backend-logs.txt

      - name: Upload backend logs
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: backend-logs
          path: backend-logs.txt

      # 9️⃣ Nettoyer les conteneurs
      - name: Stop services
        if: always()
        run: docker-compose down
