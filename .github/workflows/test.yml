name: CI - Test Application Inscription

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  integration-and-e2e-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install jq and curl
        run: |
          sudo apt-get update
          sudo apt-get install -y jq curl

      - name: Build and start services
        run: docker compose up -d --build

      - name: Wait for services to be healthy
        run: |
          echo "Waiting for services healthchecks..."
          for i in {1..20}; do
            if [ "$(docker inspect --format='{{.State.Health.Status}}' $(docker compose ps -q frontend))" = "healthy" ]; then
              echo "All services are healthy and running ✅"
              exit 0
            fi
            echo "Services are starting..."
            sleep 5
          done
          echo "Services failed to become healthy ❌"
          exit 1

      - name: Reset database users table
        run: |
          docker exec inscription-db mysql -uroot -proot inscriptions -e "DROP TABLE IF EXISTS users; CREATE TABLE users (id INT AUTO_INCREMENT PRIMARY KEY, nom VARCHAR(255), email VARCHAR(255) NOT NULL UNIQUE, created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP);"
          echo "Users table reset ✅" > test-results.txt

      # ==========================================
      # SECTION 1 : TESTS API BACKEND
      # ==========================================
      - name: Test inscription API (success)
        run: |
          RESPONSE=$(curl -s -X POST -d "nom=CIUser&email=ciuser@example.com" http://localhost:8081/api.php || echo "No response")
          echo "Inscription response: $RESPONSE" >> test-results.txt
          if [ "$(echo "$RESPONSE" | jq -r '.success')" = "true" ]; then
            echo "Test inscription passed ✅" >> test-results.txt
          else
            echo "Test inscription failed ❌" >> test-results.txt
            exit 1
          fi

      - name: Test inscription API (missing fields)
        run: |
          RESPONSE=$(curl -s -X POST -d "nom=&email=" http://localhost:8081/api.php)
          echo "Missing fields response: $RESPONSE" >> test-results.txt
          if [ "$(echo "$RESPONSE" | jq -r '.success')" = "false" ]; then
            echo "Missing fields test passed ✅" >> test-results.txt
          else
            echo "Missing fields test failed ❌" >> test-results.txt
            exit 1
          fi

      - name: Test inscription API (duplicate email)
        run: |
          RESPONSE=$(curl -s -X POST -d "nom=CIUser&email=ciuser@example.com" http://localhost:8081/api.php)
          echo "Duplicate response: $RESPONSE" >> test-results.txt
          if [ "$(echo "$RESPONSE" | jq -r '.success')" = "false" ]; then
            echo "Duplicate email test passed ✅" >> test-results.txt
          else
            echo "Duplicate email test failed ❌" >> test-results.txt
            exit 1
          fi

      # ==========================================
      # SECTION 2 : TESTS CYPRESS E2E
      # ==========================================
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies and Cypress
        run: npm install

      - name: Reset table before E2E tests
        run: |
          docker exec inscription-db mysql -uroot -proot inscriptions -e "TRUNCATE TABLE users;"

      - name: Run Cypress tests
        run: npx cypress run
        env:
          CYPRESS_BASE_URL: http://localhost:3000

      # ==========================================
      # SECTION 3 : NETTOYAGE ET EXPORT DES LOGS
      # ==========================================
      - name: Show test results
        run: cat test-results.txt

      - name: Upload test results
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results.txt

      - name: Save all container logs
        if: always()
        run: docker compose logs --no-color > all-containers-logs.txt

      - name: Upload all container logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: all-containers-logs
          path: all-containers-logs.txt

      - name: Stop services
        if: always()
        run: docker compose down
