
services:
  # 🧠 COLLECTEUR DE MÉTRIQUES (Version allégée pour Windows)
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: monitoring-cadvisor
    volumes:
      - /var/run:/var/run:ro # Seul volume lisible par Docker Desktop sous Windows
    networks:
      - app-network
    restart: unless-stopped

  # 🗄️ BASE DE DONNÉES DES MÉTRIQUES
  prometheus:
    image: prom/prometheus:latest
    container_name: monitoring-prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    networks:
      - app-network
    ports:
      - "9090:9090"
    restart: unless-stopped

  # 📊 INTERFACE VISUELLE (TABLEAUX DE BORD)
  grafana:
    image: grafana/grafana:latest
    container_name: monitoring-grafana
    volumes:
      - grafana-data:/var/lib/grafana
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=VotreMotDePasseLocal # ⬅️ Mot de passe pour votre PC
    networks:
      - app-network
    ports:
      - "3000:3000"
    restart: unless-stopped

volumes:
  prometheus-data:
  grafana-data:

networks:
  app-network:
    external: true
    name: projet-inscription-docker-avec-docker-compose-_app-network # ✅ Réseau local Windows
