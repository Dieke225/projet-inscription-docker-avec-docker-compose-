services:
  db:
    image: mysql:8.0.46
    container_name: inscription-db
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
    # ✅ AUTOMATISATION : Monte votre dossier de scripts SQL pour une création de tables 100% autonome
    volumes:
      - ./db:/docker-entrypoint-initdb.d:ro
    networks:
      - app-network
    # ✅ CORRECTION : Utilisation de $$ pour échapper la variable dans la commande CMD de Docker
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p$${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.backend
    image: dieket/inscription-backend:latest
    environment:
      - DB_HOST=${DB_HOST:-inscription-db}
      - DB_USER=${DB_USER:-root}
      # ✅ CORRECTION INTERNATIONALE : Transmet le mot de passe root sécurisé de la CI à PHP
      - DB_PASSWORD=${MYSQL_ROOT_PASSWORD:-root} 
      - DB_NAME=${DB_NAME:-inscriptions}
    networks:
      - app-network
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.frontend
    image: dieket/inscription-frontend:latest
    networks:
      - app-network
    depends_on:
      backend:
        condition: service_started

  nginx-ci:
    image: nginx:alpine
    container_name: nginx-proxy-ci
    ports:
      - "80:80"
    volumes:
      - ./nginx.ci.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - app-network
    depends_on:
      - frontend
      - backend

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: inscription-phpmyadmin
    # Note : 'links' est obsolète dans Docker moderne, le partage du 'app-network' suffit amplement
    environment:
      PMA_HOST: inscription-db # ✅ Aligné sur le container_name exact de votre service MySQL
      PMA_PORT: 3306
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    ports:
      - "8082:80"
    networks:
      - app-network
    depends_on:
      db:
        condition: service_healthy

networks:
  app-network:
    driver: bridge
