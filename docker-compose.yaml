services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.frontend
    image: dieket/inscription-frontend:latest
    networks:
      - frontend-backend
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8085"]
      interval: 5s
      timeout: 3s
      retries: 3

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.backend
    image: dieket/inscription-backend:latest
    environment:
      - DB_HOST=${DB_HOST:-inscription-db}
      - DB_USER=${DB_USER:-root}
      - DB_PASSWORD=${MYSQL_ROOT_PASSWORD:-root}
      - DB_NAME=${DB_NAME:-inscriptions}
    networks:
      - frontend-backend
      - backend-db
    volumes:
      - backend_logs:/var/log/app
      - backend_uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/api.php/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  db:
    image: mysql:8.0
    container_name: inscription-db
    restart: always
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD:-root}
      - MYSQL_DATABASE=${MYSQL_DATABASE:-inscriptions}
    volumes:
      - db_data:/var/lib/mysql
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "3306:3306"
    networks:
      - backend-db
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-root}"]
      interval: 10s
      timeout: 5s
      retries: 5

  phpmyadmin:
    image: phpmyadmin/phpmyadmin:latest
    container_name: inscription-phpmyadmin
    restart: always
    environment:
      - PMA_HOST=inscription-db
      - PMA_PORT=3306
      - PMA_USER=${DB_USER:-root}
      - PMA_PASSWORD=${MYSQL_ROOT_PASSWORD:-root}
      - APACHE_HTTP_SERVER_NAME=localhost
    ports:
      - "8082:80"
    networks:
      - backend-db
    depends_on:
      db:
        condition: service_healthy

  nginx-proxy:
    image: nginx:alpine
    restart: always
    ports:
      - "80:80"
      - "443:443" # ✅ AJOUT : Ouverture du port HTTPS sécurisé vers l'extérieur
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - certbot-etc:/etc/letsencrypt:ro          # ✅ AJOUT : Partage des certificats avec Nginx
      - certbot-var:/var/lib/letsencrypt:ro
      - webroot-path:/var/www/certbot:ro        # ✅ AJOUT : Dossier de vérification ACME pour Let's Encrypt
    networks:
      - frontend-backend
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy

  # ==========================================
  # AJOUT : CONTENEUR CERTBOT POUR LE SSL
  # ==========================================
  certbot:
    image: certbot/certbot:latest
    restart: unless-stopped
    volumes:
      - certbot-etc:/etc/letsencrypt
      - certbot-var:/var/lib/letsencrypt
      - webroot-path:/var/www/certbot
    # Commande de renouvellement automatique toutes les 12 heures
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done'"

volumes:
  frontend_data:
  backend_logs:
  backend_uploads:
  db_data:
  certbot-etc:      # ✅ AJOUT : Stockage persistant des clés de sécurité
  certbot-var:      # ✅ AJOUT
  webroot-path:     # ✅ AJOUT

networks:
  frontend-backend:
  backend-db:
