# =========================================================
# CONFIGURATION HTTP (PORT 80) : Gestion du challenge Let's Encrypt
# =========================================================
server {
    listen 80;
    server_name diekstore.com ://diekstore.com;

    # Emplacement obligatoire pour le challenge Let's Encrypt (Certbot)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirection automatique de tout le trafic HTTP vers HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# =========================================================
# CONFIGURATION HTTPS SÉCURISÉE (PORT 443)
# =========================================================
server {
    listen 443 ssl;
    server_name diekstore.com ://diekstore.com;

    resolver 127.0.0.11 valid=30s;

    # Emplacement des certificats SSL générés par Certbot
    ssl_certificate /etc/letsencrypt/live/://diekstore.com;
    ssl_certificate_key /etc/letsencrypt/live/://diekstore.com;

    # Paramètres de sécurité SSL recommandés
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Redirection de toutes les requêtes PHP (.php) vers le Backend
    location ~ \.php$ {
        set $backend_upstream http://backend:80;
        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Redirection par défaut (HTML, CSS, JS) vers le Frontend (port 8085)
    location / {
        set $frontend_upstream http://frontend:8085;
        proxy_pass $frontend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
