server {
    listen 80;
    server_name localhost;

    resolver 127.0.0.11 valid=30s;

    # Redirection des fichiers PHP vers le Backend (qui écoute sur le port 80)
    location ~ \.php$ {
        set $backend_upstream http://backend:80;
        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Redirection par défaut vers le Frontend (qui écoute sur le port 8085)
    location / {
        set $frontend_upstream http://frontend:8085; # ✅ Corrigé pour pointer sur le port 8085 d'Apache
        proxy_pass $frontend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
