
services:
  # 🧠 COLLECTEUR DE MÉTRIQUES COMPLET (Optimisé pour le noyau Linux Ubuntu)
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: monitoring-cadvisor
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    networks:
      - app-network
    restart: always # En prod, on force le redémarrage automatique en cas de panne

  # 🗄️ BASE DE DONNÉES DES MÉTRIQUES
  prometheus:
    image: prom/prometheus:latest
    container_name: monitoring-prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-prod-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    networks:
      - app-network
    # On ne publie pas le port 9090 sur Internet pour des raisons de sécurité (Seul Grafana y accède en interne)
    restart: always

  # 📊 INTERFACE VISUELLE (TABLEAUX DE BORD)
  grafana:
    image: grafana/grafana:latest
    container_name: monitoring-grafana
    volumes:
      - grafana-prod-data:/var/lib/grafana
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=VotreMotDePasseProductionSecurise # ⬅️ Mettez un mot de passe fort !
    networks:
      - app-network
    ports:
      - "3000:3000" # Accessible uniquement via le port 3000 sécurisé du VPS
    restart: always

volumes:
  prometheus-prod-data:
  grafana-prod-data:

networks:
  app-network:
    external: true
    name: inscription-app_app-network # ✅ Nom exact du réseau de production sur le VPS
